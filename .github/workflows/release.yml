name: TGym release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: tgym-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: node scripts/check-version.mjs
        working-directory: frontend
      - name: Validate previous published version
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          curl --fail --silent --show-error "https://${OWNER,,}.github.io/${NAME}/updates/latest.json?check=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/tgym-previous.json"
          PREVIOUS_VERSION_CODE="$(jq -er '.versionCode' "$RUNNER_TEMP/tgym-previous.json")" node frontend/scripts/check-version.mjs
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - name: Validate notification configuration
        run: |
          test "$HAS_GOOGLE_SERVICES" = true || { echo "Missing GOOGLE_SERVICES_JSON_BASE64"; exit 1; }
          test "$HAS_FIREBASE" = true || { echo "Missing FIREBASE_SERVICE_ACCOUNT or FIREBASE_PROJECT_ID"; exit 1; }
      - name: Validate Firebase delivery credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: node frontend/scripts/notify-release.mjs --validate
      - name: Configure Firebase application
        if: ${{ env.HAS_GOOGLE_SERVICES == 'true' }}

        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > frontend/android/app/google-services.json
      - run: VITE_GITHUB_OWNER=${{ github.repository_owner }} VITE_GITHUB_REPO=${{ github.event.repository.name }} VITE_APP_DISTRIBUTION=github pnpm run build:mobile
        working-directory: frontend
      - name: Configure Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > frontend/android/app/tgym-release.jks
          printf 'storeFile=tgym-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > frontend/android/keystore.properties
      - run: ./gradlew assembleRelease bundleRelease
        working-directory: frontend/android
      - name: Prepare release assets and update manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(grep -oP 'versionCode\s+\K\d+' frontend/android/app/build.gradle)"
          mkdir -p frontend/release frontend/updates
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "frontend/release/TGym-Android-v${VERSION}.apk"
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab "frontend/release/TGym-Android-v${VERSION}.aab"
          (cd frontend/release && sha256sum * > checksums.txt)
          APK_SHA="$(sha256sum "frontend/release/TGym-Android-v${VERSION}.apk" | cut -d' ' -f1)"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "frontend/release/TGym-Android-v${VERSION}.apk" | tee frontend/release/signature.txt
          CERT_SHA="$(node frontend/scripts/signing-certificate.mjs frontend/release/signature.txt)"
          test "$CERT_SHA" = "$(jq -er '.android.certificateSha256' "$RUNNER_TEMP/tgym-previous.json")"
          AAPT="$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)"
          "$AAPT" dump badging "frontend/release/TGym-Android-v${VERSION}.apk" > frontend/release/package.txt
          grep -F "package: name='app.framegym.mobile' versionCode='${CODE}' versionName='${VERSION}'" frontend/release/package.txt
          jarsigner -verify "frontend/release/TGym-Android-v${VERSION}.aab"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          jq -n --arg version "$VERSION" --argjson code "$CODE" --arg sha "$APK_SHA" --arg cert "$CERT_SHA" --arg commit "$GITHUB_SHA" --arg owner "$OWNER" --arg name "$NAME" --arg at "$(date -u +%FT%TZ)" '{version:$version,commit:$commit,versionCode:$code,publishedAt:$at,minimumVersion:null,mandatory:false,title:("TGym "+$version),notes:[],android:{apk:("https://github.com/"+$owner+"/"+$name+"/releases/download/v"+$version+"/TGym-Android-v"+$version+".apk"),playStore:null,sha256:$sha,certificateSha256:$cert},ios:{appStore:null}}' > frontend/updates/latest.json
      # Independent PWA migration: retain its published source/version and patch only
      # update discovery. The Android release must not ship the new native UI to PWA.
      - name: Build isolated PWA updater migration
        shell: bash
        run: |
          PREVIOUS_COMMIT="$(jq -er '.commit' "$RUNNER_TEMP/tgym-previous.json")"
          test "$(git rev-parse "${PREVIOUS_COMMIT}^{commit}")" = "$PREVIOUS_COMMIT"
          git worktree add --detach "$RUNNER_TEMP/tgym-pwa" "$PREVIOUS_COMMIT"
          cp frontend/src/lib/app-update.js "$RUNNER_TEMP/tgym-pwa/frontend/src/lib/app-update.js"
          cp frontend/public/sw.js "$RUNNER_TEMP/tgym-pwa/frontend/public/sw.js"
          cd "$RUNNER_TEMP/tgym-pwa/frontend"
          pnpm install --frozen-lockfile
          VITE_GITHUB_OWNER="${GITHUB_REPOSITORY%%/*}" VITE_GITHUB_REPO="${GITHUB_REPOSITORY#*/}" VITE_APP_DISTRIBUTION=pwa pnpm run build:pwa
          mkdir -p dist/updates dist/downloads
          cp "$RUNNER_TEMP/tgym-previous.json" dist/updates/latest.json
          curl --fail --location --silent --show-error "$(jq -er '.android.apk' "$RUNNER_TEMP/tgym-previous.json")" -o dist/downloads/TGym-latest.apk
          echo "PWA_SITE=$RUNNER_TEMP/tgym-pwa/frontend/dist" >> "$GITHUB_ENV"
      - uses: actions/upload-pages-artifact@v3
        with:
          name: pwa-migration
          path: ${{ env.PWA_SITE }}
      - uses: actions/deploy-pages@v4
        with: { artifact_name: pwa-migration }
      - name: Verify independent PWA migration
        shell: bash
        run: |
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          curl --fail --silent --show-error "https://${OWNER,,}.github.io/${NAME}/build.json?check=${GITHUB_RUN_ID}" -o "$RUNNER_TEMP/tgym-pwa-build.json"
          test "$(jq -er '.version' "$RUNNER_TEMP/tgym-pwa-build.json")" = "$(jq -er '.version' "$RUNNER_TEMP/tgym-previous.json")"
          test "$(jq -er '.commit' "$RUNNER_TEMP/tgym-pwa-build.json")" = "$GITHUB_SHA"
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            frontend/release/TGym-Android-v*.apk
            frontend/release/TGym-Android-v*.aab
            frontend/release/checksums.txt
            frontend/updates/latest.json
      - name: Publish native metadata without rebuilding the PWA
        run: |
          cp updates/latest.json "$PWA_SITE/updates/latest.json"
          cp release/TGym-Android-v*.apk "$PWA_SITE/downloads/TGym-latest.apk"
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.PWA_SITE }}
      - uses: actions/deploy-pages@v4
      - name: Verify published update metadata
        env:
          REPOSITORY: ${{ github.repository }}
        run: node frontend/scripts/verify-published-update.mjs
      - name: Notify update topic
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: node frontend/scripts/notify-release.mjs
