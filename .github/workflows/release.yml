name: TGym release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    env:
      HAS_GOOGLE_SERVICES: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 != '' }}
      HAS_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: node scripts/check-version.mjs
        working-directory: frontend
      - run: pnpm test
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend
      - name: Configure Firebase application
        if: ${{ env.HAS_GOOGLE_SERVICES == 'true' }}
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > frontend/android/app/google-services.json
      - run: VITE_GITHUB_OWNER=${{ github.repository_owner }} VITE_GITHUB_REPO=${{ github.event.repository.name }} VITE_APP_DISTRIBUTION=github pnpm run build:mobile
        working-directory: frontend
      - name: Configure Android signing
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > frontend/android/app/tgym-release.jks
          printf 'storeFile=tgym-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$STORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > frontend/android/keystore.properties
      - run: ./gradlew assembleRelease bundleRelease
        working-directory: frontend/android
      - name: Prepare release assets and update manifest
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          CODE="$(grep -oP 'versionCode\s+\K\d+' frontend/android/app/build.gradle)"
          mkdir -p frontend/release frontend/updates
          cp frontend/android/app/build/outputs/apk/release/app-release.apk "frontend/release/TGym-Android-v${VERSION}.apk"
          cp frontend/android/app/build/outputs/bundle/release/app-release.aab "frontend/release/TGym-Android-v${VERSION}.aab"
          (cd frontend/release && sha256sum * > checksums.txt)
          APK_SHA="$(sha256sum "frontend/release/TGym-Android-v${VERSION}.apk" | cut -d' ' -f1)"
          OWNER="${GITHUB_REPOSITORY%%/*}"
          NAME="${GITHUB_REPOSITORY#*/}"
          jq -n --arg version "$VERSION" --argjson code "$CODE" --arg sha "$APK_SHA" --arg owner "$OWNER" --arg name "$NAME" --arg at "$(date -u +%FT%TZ)" '{version:$version,versionCode:$code,publishedAt:$at,minimumVersion:null,mandatory:false,title:("TGym "+$version),notes:[],android:{apk:("https://"+$owner+".github.io/"+$name+"/downloads/TGym-latest.apk"),playStore:null,sha256:$sha},ios:{appStore:null}}' > frontend/updates/latest.json
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            frontend/release/TGym-Android-v*.apk
            frontend/release/TGym-Android-v*.aab
            frontend/release/checksums.txt
      - name: Build GitHub Pages PWA
        run: |
          VITE_GITHUB_OWNER=${{ github.repository_owner }} VITE_GITHUB_REPO=${{ github.event.repository.name }} VITE_APP_DISTRIBUTION=pwa pnpm run build:pwa
          cp -r updates dist/updates
          mkdir -p dist/downloads
          cp release/TGym-Android-v*.apk dist/downloads/TGym-latest.apk
        working-directory: frontend
      - uses: actions/upload-pages-artifact@v3
        with: { path: frontend/dist }
      - uses: actions/deploy-pages@v4
      - uses: google-github-actions/auth@v2
        if: ${{ env.HAS_FIREBASE == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
        id: firebase-auth
      - name: Notify update topic
        if: ${{ steps.firebase-auth.outputs.access_token != '' }}
        env:
          TOKEN: ${{ steps.firebase-auth.outputs.access_token }}
          PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          curl --fail-with-body -X POST "https://fcm.googleapis.com/v1/projects/${PROJECT}/messages:send" -H "Authorization: Bearer ${TOKEN}" -H 'Content-Type: application/json' -d "{\"message\":{\"topic\":\"tgym_updates\",\"notification\":{\"title\":\"TGym ${GITHUB_REF_NAME#v} available\",\"body\":\"A new TGym update is ready.\"},\"data\":{\"type\":\"app_update\",\"version\":\"${GITHUB_REF_NAME#v}\"}}}"
