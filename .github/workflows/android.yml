name: Validate Android
on:
  push:
    branches: [main, feature/workout-duration, feature/ui-persistence-audit, feature/training-pause]
    paths: ['frontend/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - name: Validate Firebase credentials without sending a notification
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          export UPDATE_VERSION="$(node -p "require('./frontend/package.json').version")"
          node frontend/scripts/notify-release.mjs --validate
      - name: Configure Firebase
        env:
          CONFIG: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: printf '%s' "$CONFIG" | base64 --decode > frontend/android/app/google-services.json
      - run: pnpm run build:mobile
        working-directory: frontend
      - run: ./gradlew assembleDebug :app:lintDebug
        working-directory: frontend/android
      - name: Test background workout notification on Android emulator
        shell: bash
        run: |
          sudo chmod 666 /dev/kvm
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          export ANDROID_USER_HOME="$RUNNER_TEMP/tgym-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          mkdir -p "$ANDROID_AVD_HOME"
          trap 'cat /tmp/tgym-emulator.log 2>/dev/null || true; adb logcat -d -s TGymWorkoutNotification:E AndroidRuntime:E || true' EXIT
          sdkmanager 'system-images;android-35;google_apis;x86_64' 'emulator' >/dev/null
          echo no | avdmanager create avd --force --name tgym-test --package 'system-images;android-35;google_apis;x86_64'
          "$ANDROID_HOME/emulator/emulator" -avd tgym-test -no-window -no-audio -no-boot-anim -gpu swiftshader -no-snapshot -no-metrics > /tmp/tgym-emulator.log 2>&1 &
          timeout 120 adb wait-for-device
          timeout 300 bash -c 'until adb shell getprop sys.boot_completed | grep -q 1; do sleep 2; done'
          cd frontend/android
          ./gradlew :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-notification-test-report
          path: frontend/android/app/build/reports/androidTests/
